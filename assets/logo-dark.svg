  </defs>

  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#badgeDark)"/>
  <rect x="44" y="44" width="424" height="424" rx="100" fill="none" stroke="url(#ringDark)" stroke-width="3"/>

  <rect x="122" y="126" width="268" height="272" rx="38" fill="#0B1220" stroke="#334155" stroke-width="2" filter="url(#glowDark)"/>

  <rect x="146" y="162" width="220" height="200" rx="24" fill="url(#appFillDark)"/>
  <rect x="146" y="162" width="220" height="200" rx="24" fill="none" stroke="#6366F1" stroke-opacity="0.55" stroke-width="1.5"/>

  <circle cx="170" cy="184" r="6.5" fill="#818CF8"/>
  <circle cx="191" cy="184" r="6.5" fill="#22D3EE"/>
