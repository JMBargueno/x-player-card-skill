<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Player card app mark, dark variant">
  <defs>
    <linearGradient id="badgeDark" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B3A4A"/>
    </linearGradient>
    <linearGradient id="ringDark" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="appFillDark" x1="160" y1="176" x2="350" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#164E63"/>
    </linearGradient>
    <linearGradient id="playFillDark" x1="214" y1="226" x2="300" y2="314" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
