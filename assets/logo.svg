<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Player card app mark">
  <defs>
    <linearGradient id="badge" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.48" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="sheen" x1="256" y1="40" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="appFill" x1="160" y1="176" x2="350" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="playFill" x1="214" y1="226" x2="300" y2="314" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.28"/>
    </filter>
    <filter id="cursorShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Badge -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#badge)"/>
  <rect x="44" y="44" width="424" height="424" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M140,44 h232 a100,100 0 0 1 100,100 v80 C400,140 320,92 256,92 190,92 112,150 44,210 V144 A100,100 0 0 1 144,44 Z" fill="url(#sheen)"/>

  <!-- Post / card frame -->
  <rect x="122" y="126" width="268" height="272" rx="38" fill="#ffffff" filter="url(#cardShadow)"/>

  <!-- App window -->
  <rect x="146" y="162" width="220" height="200" rx="24" fill="url(#appFill)"/>
  <rect x="146" y="162" width="220" height="200" rx="24" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>

  <!-- Window dots -->
  <circle cx="170" cy="184" r="6.5" fill="#6366F1"/>
  <circle cx="191" cy="184" r="6.5" fill="#22D3EE"/>
  <circle cx="212" cy="184" r="6.5" fill="#A5B4FC"/>

  <!-- Play control -->
  <circle cx="256" cy="268" r="44" fill="url(#playFill)"/>
  <circle cx="256" cy="268" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
  <path d="M245.5 248.5 L245.5 287.5 L280.5 268 Z" fill="#ffffff"/>

  <!-- Cursor: interactive hint -->
  <g transform="translate(318,310)" filter="url(#cursorShadow)">
    <path d="M0 0 L0 34 L8.5 26.5 L15.5 41.5 L20.5 39.2 L13.2 24.2 L24 22.5 Z" fill="#0F172A"/>
    <path d="M3.2 6.2 L3.2 28.2 L8.8 22.8 L15.2 36.2 L17.8 34.9 L11.2 21.2 L19.6 20 Z" fill="#ffffff"/>
  </g>
</svg>
