<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-label="Illustration of a social post containing an embedded interactive app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1040" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="avatar" x1="452" y1="126" x2="516" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="preview" x1="500" y1="360" x2="1100" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="0.5" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="btnPrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <filter id="card" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1E1B4B" flood-opacity="0.16"/>
    </filter>
    <filter id="embed" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#312E81" flood-opacity="0.10"/>
    </filter>
    <filter id="cursor" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <!-- soft decorative blobs -->
  <circle cx="180" cy="160" r="140" fill="#C7D2FE" fill-opacity="0.45"/>
  <circle cx="1480" cy="900" r="180" fill="#A5F3FC" fill-opacity="0.4"/>
  <circle cx="1400" cy="140" r="90" fill="#A5B4FC" fill-opacity="0.35"/>

  <text x="800" y="64" text-anchor="middle" font-family="Inter, Plus Jakarta Sans, IBM Plex Sans, sans-serif" font-size="15" font-weight="700" letter-spacing="3.2" fill="#6366F1">ILLUSTRATION</text>
  <text x="800" y="96" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="28" font-weight="700" fill="#0F172A">A live app, inside the post</text>
  <text x="800" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#475569">Generic mock — not a real account or official client</text>

  <!-- Post card -->
  <g filter="url(#card)">
    <rect x="400" y="168" width="800" height="780" rx="32" fill="#ffffff"/>
  </g>

  <!-- Header -->
  <circle cx="468" cy="228" r="28" fill="url(#avatar)"/>
  <path d="M468 216 c7 0 12 6 12 13 0 8-5 14-12 14 s-12-6-12-14 c0-7 5-13 12-13 z M450 252 c4-10 11-15 18-15 h0 c7 0 14 5 18 15 1 3-1 8-7 8 h-22 c-6 0-8-5-7-8 z" fill="#ffffff" fill-opacity="0.92"/>
  <text x="512" y="224" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0F172A">@yourhandle</text>
  <text x="512" y="246" font-family="Inter, sans-serif" font-size="14" fill="#64748B">just now  ·  Public post</text>

  <text x="440" y="296" font-family="Inter, sans-serif" font-size="20" fill="#0F172A">Try this little tool without leaving the feed.</text>
  <text x="440" y="324" font-family="Inter, sans-serif" font-size="20" fill="#0F172A">Pick a palette, then save a PNG — all in the post itself.</text>

  <!-- Embedded player app -->
  <g filter="url(#embed)">
    <rect x="440" y="356" width="720" height="500" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <!-- app title bar -->
  <rect x="440" y="356" width="720" height="64" rx="24" fill="#0F172A"/>
  <rect x="440" y="396" width="720" height="24" fill="#0F172A"/>
  <circle cx="468" cy="388" r="6" fill="#818CF8"/>
  <circle cx="490" cy="388" r="6" fill="#22D3EE"/>
  <circle cx="512" cy="388" r="6" fill="#A5B4FC"/>
  <text x="540" y="394" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#F8FAFC">Palette Studio</text>
  <rect x="1048" y="374" width="88" height="28" rx="14" fill="#312E81"/>
  <text x="1092" y="393" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6" fill="#A5B4FC">LIVE APP</text>

  <!-- Canvas preview -->
  <rect x="472" y="444" width="656" height="196" rx="18" fill="url(#preview)"/>
  <rect x="700" y="492" width="200" height="100" rx="20" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="720" y="512" width="48" height="60" rx="8" fill="#4F46E5"/>
  <rect x="776" y="512" width="48" height="60" rx="8" fill="#0891B2"/>
  <rect x="832" y="512" width="48" height="60" rx="8" fill="#F59E0B"/>

  <!-- Swatches -->
  <text x="472" y="676" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#64748B">Swatches</text>
  <rect x="472" y="688" width="56" height="56" rx="14" fill="#4F46E5"/>
  <rect x="540" y="688" width="56" height="56" rx="14" fill="#0891B2"/>
  <rect x="608" y="688" width="56" height="56" rx="14" fill="#F59E0B"/>
  <rect x="676" y="688" width="56" height="56" rx="14" fill="#F8FAFC" stroke="#4F46E5" stroke-width="3"/>
  <!-- selected check on last? or ring already -->
  <rect x="748" y="704" width="220" height="24" rx="12" fill="#E2E8F0"/>
  <circle cx="820" cy="716" r="14" fill="#4F46E5"/>
  <text x="980" y="722" font-family="Inter, sans-serif" font-size="12" fill="#64748B">Hue</text>

  <!-- Buttons -->
  <rect x="472" y="768" width="200" height="52" rx="14" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="572" y="800" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#334155">Shuffle</text>
  <rect x="688" y="768" width="200" height="52" rx="14" fill="url(#btnPrimary)"/>
  <text x="788" y="800" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Save PNG</text>

  <!-- Cursor hovering Save PNG -->
  <g transform="translate(848,804)" filter="url(#cursor)">
    <path d="M0 0 L0 30 L7.5 23.5 L13.8 36.8 L18.2 34.8 L11.6 21.4 L21.2 20 Z" fill="#0F172A"/>
    <path d="M2.8 5.4 L2.8 24.8 L7.8 20.2 L13.4 32 L15.6 31 L9.8 18.8 L17.4 17.8 Z" fill="#ffffff"/>
  </g>

  <!-- Footer of post -->
  <text x="440" y="890" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">example.com/tools/palette-studio</text>
  <text x="440" y="916" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Reply   ·   Repost   ·   Like   ·   Share</text>
</svg>
